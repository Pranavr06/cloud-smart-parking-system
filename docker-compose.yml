services:
  app:
    build: .
    image: smart-parking:local
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_MODE: local
      AUTH_MODE: local
      LOCAL_SESSION_SECRET: ${LOCAL_SESSION_SECRET:-local-compose-secret-change-me}
      LOCAL_ADMIN_EMAILS: ${LOCAL_ADMIN_EMAILS:-}
      DETECTION_API_KEY: ${DETECTION_API_KEY:-}
    volumes:
      - app-data:/app/backend/data
    restart: unless-stopped

volumes:
  app-data:
